<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./app.js" defer></script>
    <title>Cadastro de Perfis</title>
</head>
<body>
    <h1>Cadastro de Perfis</h1>
    <form id="formulario">
        <input  id="nome" type="text"  placeholder="Nome"  plahonder="Digite seu nome">
        <input  id="cargo" type="text" placeholder="Dígite seu cargo...">
        <input  id="imagem" type="text"  placeholder="Dígite o endereço da imagem" >
        <button id="cadastrar" type="button">Cadadastrar</button>
    </form>
    <div class="card-container" id="container-cards">
        <div class="card">
            <img src="./img/img1.jpg" alt="Foto perfil 1">
            <p>Lucas - Desenvolvedor</p>
        </div>
        <div class="card">
            <img src="./img/img2 (2).png" alt=" Foto perfil 2">
            <p>Maria - Designer</p>
        </div>
        <div class="card">
            <img src="./img/img3.png" alt="Foto de perfil 3">
            <p>João - Analista</p>
        </div>
        <div id="galeria"></div> 
</body>
</html>
