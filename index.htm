<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Cadastro de Perfis</title>
</head>
<body>
    <h1>Cadastro de Perfis</h1>
    <form class="formulário">
        <input type="text" class="campo" placeholder="Nome">
        <input type="text" class="campo" placeholder="Cargo">
        <input type="text" class="campo" placeholder="URL da Imagem">
        <button type="submit">Cadadastrar</button>
    </form>
    <div class="card-container">
        <div class="card">
            <img src="./img/img1.jpg" alt="Foto perfil 1">
            <p>Lucas - Desenvolvedor</p>
        </div>
        <div class="card">
            <img src="./img/img2 (2).png" alt=" Foto perfil 2">
            <p>Maria - Designer</p>
        </div>
        <div class="card">
            <img src="./img/img3.png" alt="Foto de perfil 3">
            <p>João - Analista</p>
        </div>
</body>
</html>
